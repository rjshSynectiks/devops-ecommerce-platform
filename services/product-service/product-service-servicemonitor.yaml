apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor

metadata:
  name: product-service
  namespace: monitoring
  labels:
    release: monitoring

spec:
  namespaceSelector:
    matchNames:
      - ecommerce

  selector:
    matchLabels:
      app: product-service

  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s