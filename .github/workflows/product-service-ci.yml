name: Product Service CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ecommerce
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ecommerce -d ecommerce"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Show Java and Maven versions
        run: |
          java --version
          mvn --version

      - name: Run Maven tests
        working-directory: services/product-service
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ecommerce
          SPRING_DATASOURCE_USERNAME: ecommerce
          SPRING_DATASOURCE_PASSWORD: ecommerce
        run: mvn -B -Duser.timezone=Asia/Kolkata test

      - name: Build application
        working-directory: services/product-service
        run: mvn -B -DskipTests package

      - name: Build Docker image
        run: docker build -t ecommerce-product-service:${{ github.sha }} ./services/product-service

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker tag ecommerce-product-service:${{ github.sha }} rjshsynectiks/ecommerce-product-service:${{ github.sha }}

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push rjshsynectiks/ecommerce-product-service:${{ github.sha }}
