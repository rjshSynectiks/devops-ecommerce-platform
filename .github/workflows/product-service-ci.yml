name: Product Service CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ecommerce
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ecommerce -d ecommerce"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Show Java and Maven versions
        run: |
          java --version
          mvn --version

      - name: Run Maven tests
        working-directory: services/product-service
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ecommerce
          SPRING_DATASOURCE_USERNAME: ecommerce
          SPRING_DATASOURCE_PASSWORD: ecommerce
        run: mvn -B -Duser.timezone=Asia/Kolkata test

      - name: Build application
        working-directory: services/product-service
        run: mvn -B -DskipTests package
